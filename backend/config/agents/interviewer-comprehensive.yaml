id: "interviewer-comprehensive"
prompt_template: "data/prompt/interviewer_comprehensive.md"
llm:
  provider: "mimo"
  model: "mimo-v2.5-pro"
  temperature: 0.7
  fallback:
    provider: "mimo"
    model: "mimo-v2.5"
    temperature: 0.7
tools:
  - save_real_question
skills: []
context:
  max_history_tokens: 100000
  compact_threshold: 80000
policy:
  max_steps: 15
  parallel_tools: 3
  tool_timeout: 30.0
